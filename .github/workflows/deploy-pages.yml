name: Build & Deploy Demo Platform to gh-pages Branch

on:
  push:
    branches:
      - master
    paths:
      - 'docs/site/**'
      - '**/*.md'
      - 'LICENSE'
      - 'config/**'
      - 'conductor/**'
      - 'assets/**'
      - 'scripts/generate-docs.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/document-library.mjs'
      - 'scripts/test-docs.mjs'
      - 'scripts/test-document-library.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-sync:
    name: Build & Deploy to gh-pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned build-only documentation dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Verify documentation before publication
        run: |
          npm run docs:check
          npm run test:docs

      - name: Build complete static documentation distribution
        run: npm run docs:build

      - name: Deploy to Dedicated gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          exclude_assets: '.github,.hela-docs-build.json'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy(site): automated build and sync from master (${{ github.sha }})'
