name: HeLa MCP Ecosystem CI

on:
  push:
    branches: [master, main, development]
  pull_request:
    branches: [master, main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-validation:
    name: Client Matrix (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate JSON & Snapshot Schema
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("config/inventory.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("config/profiles.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("config/snapshots/v1.0.0.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("config/snapshots/latest-stable.json","utf8"))'
          for f in config/*-example.json; do
            node -e 'const p=process.argv[1]; JSON.parse(require("fs").readFileSync(p,"utf8"))' "$f"
          done

      - name: Cross-check Profiles vs Canonical HeLa Inventory
        run: |
          node -e '
            const data = JSON.parse(require("fs").readFileSync("config/inventory.json", "utf8"));
            const inv = data.inventory;
            const aliases = data.aliases || {};
            const profs = JSON.parse(require("fs").readFileSync("config/profiles.json", "utf8")).profiles;
            for (const p of profs) {
              for (const s of p.servers) {
                const resolved = inv[s] || inv[aliases[s]];
                if (!resolved) {
                  console.error("Unknown server \\\"" + s + "\\\" referenced in profile \\\"" + p.id + "\\\".");
                  process.exit(1);
                }
              }
            }
            console.log("All profiles cleanly resolve to canonical inventory entries.");
          '

      - name: Run 80-Combination Multi-Client Matrix Test Suite
        run: npm run test:matrix

      - name: Install pinned documentation build dependencies
        if: ${{ matrix.node-version == 22 }}
        run: npm ci --ignore-scripts --no-fund

      - name: Check generated documentation and browser configuration previews
        if: ${{ matrix.node-version == 22 }}
        run: |
          npm run docs:check
          npm run test:docs

      - name: Verify Setup & Doctor Script Interfaces
        run: |
          ./setup.sh --help
          node --check scripts/doctor.mjs

      - name: Test installer failure handling and isolated fixture installs
        if: ${{ matrix.node-version == 22 }}
        run: npm run test:install

  docker-installation:
    name: Clean Docker installation and actual MCP doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify selected cells and runtime without optional local model
        run: |
          ./setup.sh --mode docker-runtime --profile minimal --without-model --prefix "$RUNNER_TEMP/hela-docker" --client opencode --non-interactive
          ./setup.sh doctor --prefix "$RUNNER_TEMP/hela-docker" --json
      - name: Switch deployment mode in place and verify each mode
        run: |
          ./setup.sh mode --prefix "$RUNNER_TEMP/hela-docker" --mode runtime --without-model --client skip --non-interactive
          ./setup.sh doctor --prefix "$RUNNER_TEMP/hela-docker" --json
          ./setup.sh mode --prefix "$RUNNER_TEMP/hela-docker" --mode docker-runtime --client skip --non-interactive
          ./setup.sh doctor --prefix "$RUNNER_TEMP/hela-docker" --json

  nix-installation:
    name: Clean pinned Nix runtime installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build a GC-rooted runtime and verify actual MCP transports
        run: |
          ./setup.sh --mode nix --profile minimal --without-model --prefix "$RUNNER_TEMP/hela-nix" --client codex --non-interactive
          ./setup.sh doctor --mode nix --prefix "$RUNNER_TEMP/hela-nix" --json

  shell-and-precommit:
    name: Shell Scripts & Pre-Commit Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax-check all shell scripts
        run: |
          set -e
          for f in setup.sh update.sh scripts/*.sh; do
            bash -n "$f" && echo "OK: $f"
          done

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and Run Pre-Commit Hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files
