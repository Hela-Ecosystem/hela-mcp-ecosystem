# Generated Codex / ChatGPT MCP Server Configuration

[mcp_servers.hela-mitosis]
command = "node"
args = ["/path/to/mcp-ecosystem/chaining-mcp/dist/index.js"]
[mcp_servers.hela-mitosis.env]
MEMORY_FILE_PATH = "/path/to/mcp-ecosystem/chaining-mcp/data/memory.json"
AWESOME_COPILOT_ENABLED = "true"
RELIABILITY_MONITORING_ENABLED = "true"
CHAINING_TOOL_TIMEOUT_MS = "10000"
CHAINING_LLM_MODEL = "openrouter/free"
CHAINING_LLM_BASE_URL = "https://openrouter.ai/api/v1"

[mcp_servers.hela-genome]
command = "node"
args = ["/path/to/mcp-ecosystem/project-mcp/dist/index.js"]

[mcp_servers.hela-membrane]
command = "node"
args = ["/path/to/mcp-ecosystem/filesystem-mcp/dist/index.js"]

[mcp_servers.hela-nucleus]
command = "node"
args = ["/path/to/mcp-ecosystem/terminal-mcp/build/index.js"]

[mcp_servers.hela-ribosome]
command = "node"
args = ["/path/to/mcp-ecosystem/menager-mcp/build/index.js"]

[mcp_servers.hela-enzyme]
command = "node"
args = ["/path/to/mcp-ecosystem/researcher-mcp/dist/index.js"]
[mcp_servers.hela-enzyme.env]
WIKIPEDIA_CACHE_MAX = "100"
WIKIPEDIA_CACHE_TTL = "300000"
WIKIPEDIA_DEFAULT_LANGUAGE = "en"

[mcp_servers.hela-phenotype]
command = "node"
args = ["/path/to/mcp-ecosystem/designer-mcp/dist/index.js"]

[mcp_servers.hela-cytosol]
command = "node"
args = ["/path/to/mcp-ecosystem/browser-mcp/src/server.js"]
