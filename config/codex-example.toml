# Generated Codex / ChatGPT MCP Server Configuration

[mcp_servers.hela-mitosis]
command = "node"
args = ["/absolute/path/to/MCPservers/chaining-mcp/dist/index.js"]
[mcp_servers.hela-mitosis.env]
MEMORY_FILE_PATH = "/absolute/path/to/MCPservers/chaining-mcp/data/memory.json"
AWESOME_COPILOT_ENABLED = "true"
RELIABILITY_MONITORING_ENABLED = "true"
CHAINING_TOOL_TIMEOUT_MS = "10000"
CHAINING_LLM_ENABLED = "false"
CHAINING_LLM_MODEL = "openrouter/free"
CHAINING_LLM_BASE_URL = "https://openrouter.ai/api/v1"
HELA_PROFILE = "dev-workspace"

[mcp_servers.hela-genome]
command = "node"
args = ["/absolute/path/to/MCPservers/project-mcp/dist/index.js"]

[mcp_servers.hela-membrane]
command = "node"
args = ["/absolute/path/to/MCPservers/filesystem-mcp/dist/index.js"]

[mcp_servers.hela-nucleus]
command = "node"
args = ["/absolute/path/to/MCPservers/terminal-mcp/build/index.js"]

[mcp_servers.hela-ribosome]
command = "node"
args = ["/absolute/path/to/MCPservers/menager-mcp/build/index.js"]

[mcp_servers.hela-enzyme]
command = "node"
args = ["/absolute/path/to/MCPservers/researcher-mcp/dist/index.js"]
[mcp_servers.hela-enzyme.env]
WIKIPEDIA_CACHE_MAX = "100"
WIKIPEDIA_CACHE_TTL = "300000"
WIKIPEDIA_DEFAULT_LANGUAGE = "en"

[mcp_servers.hela-phenotype]
command = "node"
args = ["/absolute/path/to/MCPservers/designer-mcp/dist/index.js"]

[mcp_servers.hela-cytosol]
command = "node"
args = ["/absolute/path/to/MCPservers/browser-mcp/src/server.js"]
